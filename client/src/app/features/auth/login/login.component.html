<div class="mx-auto flex max-w-sm flex-col gap-4 py-8">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Log in</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2 pt-2">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <mat-error>A valid email is required.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <mat-error>Password is required.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()" class="mt-2">
          @if (submitting()) {
            <mat-spinner diameter="20" class="inline-block" />
          } @else {
            Log in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <p class="text-center text-sm">
    Don't have an account?
    <a routerLink="/register" class="font-medium">Register</a>
  </p>
</div>
