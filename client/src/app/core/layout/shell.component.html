<mat-toolbar color="primary" class="flex! items-center justify-between">
  <a routerLink="/" class="text-lg font-medium no-underline text-inherit">JewelryHub</a>

  <div class="flex items-center gap-1">
    @if (auth.isAuthenticated()) {
      <span class="mr-2 text-sm">{{ auth.currentUser()?.firstName }}</span>
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    } @else {
      <a mat-button routerLink="/login">Log in</a>
      <a mat-flat-button routerLink="/register">Register</a>
    }
  </div>
</mat-toolbar>

<main class="mx-auto max-w-5xl p-4">
  <router-outlet />
</main>
